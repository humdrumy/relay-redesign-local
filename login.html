<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Relay</title><link rel="stylesheet" href="/login.css"></head><body><main><div class="mark">R</div><h1>Welcome to Relay</h1><p>Sign in to your private engineering room.</p><form id="auth-form"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="current-password" minlength="12" required></label><button type="submit">Sign in</button><button type="button" id="register">Create your account</button></form><button type="button" id="send-code">Send verification code</button><form id="verify-form" hidden><label>Verification code<input name="otp" inputmode="numeric" autocomplete="one-time-code" required maxlength="12"></label><button type="submit">Verify email</button></form><p id="status" role="status"></p><small>Access is restricted to invited accounts. Verify your email before entering.</small></main><script type="module" src="/login.mjs"></script></body></html>
